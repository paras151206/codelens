[project]
name = "codelens"
version = "1.0.0"
requires-python = ">=3.11,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "httpx>=0.27,<1", "pydantic-settings>=2.6,<3", "sentence-transformers>=3.3,<6", "qdrant-client>=1.13,<2", "rank-bm25==0.2.2", "flashrank>=0.2.10,<0.3", "tree-sitter-language-pack==0.9.0", "tree-sitter==0.25.2", "numpy>=1.26,<3"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
