services:
  - type: web
    name: codelens-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: RERANKER_MODEL
        value: ms-marco-TinyBERT-L-2-v2
      - key: RERANK_ENABLED
        value: true
      - key: CORS_ORIGINS
        sync: false
      - key: ACCESS_TOKEN
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODELS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODELS
        sync: false
